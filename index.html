<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Top-up Premium Calculator — Renewal 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page" role="group" aria-label="Medical top-up premium calculator">

  <header class="head">
    <div class="head-text">
      <span class="eyebrow">Medical Top-up Premium Calculator</span>
    </div>
    <span class="badge">Renewal&nbsp;Year&nbsp;2026</span>
  </header>

  <div class="controls">
    <label for="plan">Additional Cover</label>
    <select id="plan" aria-label="Additional cover amount">
      <option value="Additional ₹2 Lakh Cover">₹2 Lakh</option>
      <option value="Additional ₹3 Lakh Cover">₹3 Lakh</option>
      <option value="Additional ₹4 Lakh Cover">₹4 Lakh</option>
    </select>
  </div>

  <div class="rows" id="rows"></div>

  <footer class="foot">
    <div class="result">
      <span class="result-label">Premium excl. GST</span>
      <span id="total" class="result-value">₹0</span>
    </div>
    <button id="resetBtn" type="button" aria-label="Reset all values">Reset</button>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
